<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay a Trustpal business</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/landing.css"><link rel="stylesheet" href="/wallet-modal.css">
<style>
.paywrap{max-width:560px;margin:0 auto;padding:40px 20px 80px}
.paywrap h1{font-size:clamp(30px,6vw,44px);max-width:none;text-align:left;margin-bottom:10px}
.paywrap .slab{margin-top:24px}
.field{display:grid;gap:8px;margin-bottom:16px}.field label{color:var(--c4);font-weight:600;font-size:14px}
.field input{height:52px;padding:0 20px;border-radius:99px;border:1px solid #cccfce2a;background:#06141B;color:#fff;font:500 16px var(--sans);width:100%}
.field input:focus{outline:2px solid var(--c5);outline-offset:2px}
.to{font:500 14px var(--mono);color:#fff;word-break:break-all;background:#06141B;border-radius:20px;padding:12px 16px}
.msg{min-height:24px;margin:14px 0 0;font-size:15px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg a{color:#fff}
.chip{display:inline-flex;gap:8px;align-items:center;margin-bottom:6px;padding:6px 14px;border-radius:99px;background:#253745;font-size:13.5px;font-weight:600}
</style></head><body>
<div class="ambient" aria-hidden="true"></div>
<main class="paywrap">
  <a class="brand" href="/" style="margin-bottom:34px;display:inline-flex"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="6" width="22" height="9" rx="4.5" fill="#CCD0CF"/><rect x="5" y="11.5" width="22" height="9" rx="4.5" fill="#9BA8AB" opacity=".92"/><rect x="5" y="17" width="22" height="9" rx="4.5" fill="#4A5C6A"/></svg>Trustpal</a>
  <h1>Pay this business</h1>
  <p class="sub" style="color:var(--c4)">Your payment goes to the business's treasury contract on the NEAR test network. The business's rules then split it automatically. This is test money only.</p>
  <section class="slab">
    <div class="field"><label>Paying to</label><div class="to" id="to">…</div></div>
    <div class="field"><label for="amt">Amount (NEAR)</label><input id="amt" value="1" inputmode="decimal" autocomplete="off"></div>
    <div class="field"><label for="memo">Note (an invoice number or short description)</label><input id="memo" value="Invoice payment" maxlength="64" autocomplete="off"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="conn">Connect wallet</button><button class="btn" id="go" hidden>Pay now</button><button class="btn ghost" id="out" hidden>Disconnect</button></div>
    <p class="msg" id="msg" role="status"></p>
  </section>
  <p class="note" style="color:var(--c3);font-size:13px;margin-top:18px">You confirm the payment inside your own wallet. This page never sees your keys.</p>
</main>
<script src="/wallet.js"></script>
<script>
const $=id=>document.getElementById(id);const q=new URLSearchParams(location.search);
const to=(q.get('to')||'omni6nt-policy3.testnet').toLowerCase();
$('to').textContent=to;
if(!/^[a-z0-9._-]{2,64}$/.test(to)){$('msg').className='msg bad';$('msg').textContent='This payment link has an invalid account name.';$('conn').disabled=true}
function view(){const a=TrustpalWallet.account();$('conn').hidden=!!a;$('go').hidden=!a;$('out').hidden=!a;if(a){$('msg').className='msg';$('msg').textContent='Connected as '+a+'.'}}
TrustpalWallet.init(to).then(r=>{TrustpalWallet.onChange(view);view();if(r.returnedTx){$('msg').className='msg ok';$('msg').innerHTML='Payment sent. <a target="_blank" rel="noopener" href="https://testnet.nearblocks.io/txns/'+r.returnedTx+'">See it on the explorer</a>.'}}).catch(e=>{$('msg').className='msg bad';$('msg').textContent='Wallet could not start: '+e.message});
$('conn').onclick=()=>TrustpalWallet.connect();$('out').onclick=()=>TrustpalWallet.disconnect();
$('go').onclick=async()=>{const amt=$('amt').value.trim();if(!/^\d+(\.\d{1,6})?$/.test(amt)||Number(amt)<=0){$('msg').className='msg bad';$('msg').textContent='Enter an amount like 1 or 0.5';return}
 $('go').disabled=true;$('msg').className='msg';$('msg').textContent='Waiting for your wallet…';
 try{const r=await TrustpalWallet.payBusiness({memo:$('memo').value,amountNear:amt});$('msg').className='msg ok';$('msg').innerHTML='Payment sent'+(r.hash?'. <a target="_blank" rel="noopener" href="https://testnet.nearblocks.io/txns/'+r.hash+'">See it on the explorer</a>':'.')}
 catch(e){$('msg').className='msg bad';$('msg').textContent='The payment did not go through: '+e.message}
 $('go').disabled=false};
</script></body></html>
