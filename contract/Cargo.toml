[package]
name = "trustpal-policy"
version = "0.1.0"
edition = "2021"
description = "Trustpal policy contract: recipient allowlist, per-payment and daily limits, exact one-time owner approvals, revenue split, pause switch."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
